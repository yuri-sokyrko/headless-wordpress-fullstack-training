query PostsList($first: Int!, $after: String) {
  posts(
    first: $first
    after: $after
    where: { status: PUBLISH, orderby: { field: DATE, order: DESC } }
  ) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...PostCardFields
    }
  }
}

# `content` is GONE. The debt Lesson 09.4 took on and Lesson 10.5 re-labelled is
# paid here: the body is structured data, and no route renders an HTML blob.
query PostBySlug($slug: ID!, $asPreview: Boolean) {
  post(id: $slug, idType: SLUG, asPreview: $asPreview) {
    ...PostCardFields
    ...EditorBlocks
  }
}

query PostsSlug($first: Int!) {
  posts(first: $first, where: { status: PUBLISH }) {
    nodes {
      slug
    }
  }
}
