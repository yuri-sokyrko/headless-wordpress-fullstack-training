# next-app/src/graphql/incidents.graphql
# /[locale]/incidents, /[locale]/incidents/[slug], and the homepage feeds.
# Fields deleted in Lesson 10.5's audit: databaseId (nothing renders a WP integer id),
# blameScore (a computed field the card does not display).

query IncidentsList($first: Int!, $after: String, $search: String) {
  incidents(
    first: $first
    after: $after
    where: { status: PUBLISH, search: $search, orderby: { field: DATE, order: DESC } }
  ) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...IncidentCardFields
    }
  }
}

# `id: $slug, idType: SLUG`. A bare `id:` carrying a slug returns null — Lesson 05.3.
query IncidentBySlug($slug: ID!) {
  incident(id: $slug, idType: SLUG) {
    ...IncidentDetailFields
  }
}

query IncidentSlugs($first: Int!) {
  incidents(first: $first, where: { status: PUBLISH }) {
    nodes {
      slug
    }
  }
}

query HomepageFeeds($featuredCount: Int!, $recentCount: Int!) {
  catastrophic: incidents(
    first: $featuredCount
    where: { status: PUBLISH, severityIn: ["s1-catastrophic"] }
  ) {
    nodes {
      ...IncidentCardFields
    }
  }
  recent: incidents(first: $recentCount, where: { status: PUBLISH }) {
    nodes {
      ...IncidentCardFields
    }
  }
}

# For btt/incident-ticker (Lesson 14.4). This query is the TypeScript half of a
# pair: render.php in blame-the-tech-blocks runs the WP_Query equivalent for the
# editor preview. Change one, change the other — Lesson 23.5 has the contract test.
# `...IncidentCardFields` and not a new field set: the ticker renders title,
# severity, downtime and environment, which is exactly that fragment.
# `severityIn` is the one narrow taxonomy argument the plugin registers (Lesson
# 06.1 §9). No `taxQuery` exists in this schema — 05.2 §6 refuses the extension
# that would add one. A `[String!]!` variable is accepted in a `[String]`
# position, so the variable keeps its own non-null contract with the component.
query IncidentTicker($first: Int!, $severities: [String!]!) {
  incidents(
    first: $first
    where: { status: PUBLISH, orderby: { field: DATE, order: DESC }, severityIn: $severities }
  ) {
    nodes {
      ...IncidentCardFields
    }
  }
}
