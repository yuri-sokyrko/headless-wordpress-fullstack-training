# /[locale]/scapegoats. `count` is maintained by WordPress in wp_term_taxonomy, so the
# leaderboard is one indexed read rather than a grouped COUNT(*) — Lesson 05.4 proved it
# with EXPLAIN, and it is why `scapegoat` is a taxonomy and not a CPT.
query ScapegoatLeaderboard($first: Int!) {
  scapegoats(first: $first, where: { orderby: COUNT, order: DESC, hideEmpty: false }) {
    nodes {
      id
      name
      slug
      count
      scapegoatProfile {
        tagline
        defensiveness
      }
    }
  }
}

# For btt/scapegoat-picker (Lesson 14.4). The block stored a term ID, not a copy —
# Lesson 13.3 — so the component resolves it here. DATABASE_ID, because that is
# what the block has.
query ScapegoatById($id: ID!) {
  scapegoat(id: $id, idType: DATABASE_ID) {
    id
    name
    slug
    count
    scapegoatProfile {
      tagline
      defensiveness
    }
  }
}

# generateStaticParams for /[locale]/scapegoats/[slug]. hideEmpty: false so a
# term with no incidents yet still gets a page rather than a 404.
query ScapegoatSlugs($first: Int!) {
  scapegoats(first: $first, where: { hideEmpty: false }) {
    nodes {
      slug
    }
  }
}

# The term, its SCF term field group (appendix 03 §4.2), and its incidents.
# `incidents` here is the term-to-post connection WPGraphQL generates because
# `scapegoat` is registered for the `incident` post type — the same "the
# taxonomy already knows" property that makes the leaderboard one indexed read
# (Lesson 09.4 §8). Verification check 8 proves the field exists rather than
# trusting this comment.
#
# `avatar` is deliberately not selected: it is an AcfMediaItemConnectionEdge and
# rendering it well needs `mediaDetails` for next/image (Lesson 14.5). Out of
# scope for a page whose job is the term and its incidents.
query ScapegoatBySlug($slug: ID!, $first: Int!) {
  scapegoat(id: $slug, idType: SLUG) {
    id
    name
    slug
    count
    scapegoatProfile {
      tagline
      defensiveness
      officialExcuse
      firstBlamedOn
      isSentient
    }
    incidents(first: $first, where: { status: PUBLISH }) {
      nodes {
        ...IncidentCardFields
      }
    }
  }
}
