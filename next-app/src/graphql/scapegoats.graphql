# /[locale]/scapegoats. `count` is maintained by WordPress in wp_term_taxonomy, so the
# leaderboard is one indexed read rather than a grouped COUNT(*) — Lesson 05.4 proved it
# with EXPLAIN, and it is why `scapegoat` is a taxonomy and not a CPT.
query ScapegoatLeaderboard($first: Int!) {
  scapegoats(first: $first, where: { orderby: COUNT, order: DESC, hideEmpty: false }) {
    nodes {
      id
      name
      slug
      count
      scapegoatProfile {
        tagline
        defensiveness
      }
    }
  }
}

# For btt/scapegoat-picker (Lesson 14.4). The block stored a term ID, not a copy —
# Lesson 13.3 — so the component resolves it here. DATABASE_ID, because that is
# what the block has.
query ScapegoatById($id: ID!) {
  scapegoat(id: $id, idType: DATABASE_ID) {
    id
    name
    slug
    count
    scapegoatProfile {
      tagline
      defensiveness
    }
  }
}
