# GraphQL configuration — read by the VS Code GraphQL extension.
#
# It has to live at the repository ROOT rather than inside next-app/, because
# the two halves of the contract are in different directories: the schema is
# WordPress's output and the documents are the front end's input. That split is
# the whole point of Lesson 01.3's note on where schema.graphql lives.
#
#   wordpress-headless/schema.graphql   generated by `wp graphql generate-static-schema`,
#                                       committed, and reviewed as a contract (Lesson 06.3)
#   next-app/src/**/*.graphql           the operations Module 10 feeds to codegen
#
# NOTE the duplication, so it does not surprise you: eslint.config.mjs states
# the same schema path for @graphql-eslint (Lesson 23.5). Two tools, two config
# formats, one file — if you move schema.graphql, both need editing, and the
# lint job is the one that will tell you.
schema: wordpress-headless/schema.graphql
documents:
  - next-app/src/**/*.graphql
  - next-app/src/**/*.{ts,tsx}

extensions:
  languageService:
    # Do not try to reach a live /graphql endpoint for completion. The schema on
    # disk is the contract; a running container is not required to write a query,
    # and depending on one makes the editor lie whenever Docker is down.
    enableValidation: true
